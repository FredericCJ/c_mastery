schema: spec-driven
context: |
  C Mastery is a C17 curriculum with bounded C23 comparisons. Preserve the active
  manifest's freestanding restrictions, historical IDs/receipts and solution
  separation. Canonical obligations live in curriculum/v5/expansion/work_inventory.json
  and its canonical sources. An authorized native-Ubuntu revision is underway;
  do not restart approval or invent a competing completion ledger. Reference
  existing obligation IDs and change canonical sources/generators. Implemented,
  executed, hardware-observed and independently-assessed are separate states.
rules:
  proposal:
    - Identify canonical obligation IDs, source artifacts and preserved history.
  design:
    - State contracts, failure behavior, independent oracles and evidence limits.
  tasks:
    - Link tasks to canonical obligations; never infer evidence from checkboxes.
    - Do not impose learner hour ceilings or mechanical exercise-count quotas.
operations:
  apply:
    guidance:
      - Continue authorized work without routine reapproval.
      - Do not commit, push, publish or change privileged host policy automatically.
  archive:
    guidance:
      - Retain unsatisfied external evidence; archive only completed change artifacts.
