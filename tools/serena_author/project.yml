project_name: c_mastery
language_backend: LSP
agent_interface: tools
language_servers: [python_ty, cpp]
ls_workspace_folders: [cmastery, labs/foundations, tools]
read_only: true
default_modes: [no-memories, no-onboarding]
ignore_all_files_in_gitignore: true
ignored_paths:
  - "/*"
  - "!/cmastery/"
  - "!/labs/"
  - "/labs/*"
  - "!/labs/foundations/"
  - "!/tools/"
  - "/tools/*"
  - "!/tools/build_v5.py"
  - "!/tools/public_validation.py"
  - "!/tools/public_exports.py"
encoding: utf-8
